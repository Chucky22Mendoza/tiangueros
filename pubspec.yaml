name: tianguis_control
description: "Tianguis Control - POS offline para puestos de tianguis mexicanos."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State
  flutter_riverpod: ^3.4.3

  # Navegación
  go_router: ^18.0.2

  # Persistencia local
  hive_ce: ^2.20.1
  hive_ce_flutter: ^2.4.0

  # Formato / gráficos
  intl: ^0.20.2
  fl_chart: ^1.2.0

  # Archivos / imágenes
  path_provider: ^2.1.6
  file_picker: ^13.1.0
  share_plus: ^13.3.0
  image_picker: ^1.2.3

  # Utilidades
  cupertino_icons: ^1.0.9
  uuid: ^4.6.0
  csv: ^8.0.0
  collection: ^1.19.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  hive_ce_generator: ^1.10.0
  build_runner: ^2.4.13

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
